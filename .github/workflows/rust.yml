name: rust

on:
  push:
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"

defaults:
  run:
    working-directory: rust

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-latest, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  integration-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 18 and pgvector (PGDG)
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-18 postgresql-18-pgvector
      - run: cargo test -- --include-ignored
        env:
          BML_TEST_PG_BINDIR: /usr/lib/postgresql/18/bin

  integration-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 18 and pgvector (Homebrew)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install postgresql@18 pgvector
          echo "BML_TEST_PG_BINDIR=$(brew --prefix postgresql@18)/bin" >> "$GITHUB_ENV"
      - run: cargo test -- --include-ignored
