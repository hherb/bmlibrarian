[package]
name = "pubmed-ingest-spike"
version = "0.0.0"
edition = "2024"
publish = false
description = "Phase 0a: PubMed baseline parse + binary-COPY load, measured against the Python importer"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
memchr = "2"
postgres = { version = "0.19", features = ["with-chrono-0_4", "with-serde_json-1"] }
rayon = "1"
roxmltree = "0.21"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"
