[package]
name = "embedding-throughput-spike"
version = "0.0.0"
edition = "2024"
publish = false
description = "Phase 0b: arctic-embed-l-v2.0 (XLM-RoBERTa large) on candle/Metal vs sentence-transformers"

[dependencies]
anyhow = "1"
candle-core = { version = "0.11", features = ["metal"] }
candle-nn = { version = "0.11", features = ["metal"] }
candle-transformers = { version = "0.11", features = ["metal"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }

[profile.release]
codegen-units = 1
lto = "thin"
