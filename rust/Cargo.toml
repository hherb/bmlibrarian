[workspace]
resolver = "2"
members = ["bml-pgserver", "bml-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
bml-pgserver = { path = "bml-pgserver" }
postgres = "0.19"
postgres-protocol = "0.6"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
getrandom = "0.3"
sysinfo = { version = "0.35", default-features = false, features = ["system"] }
tempfile = "3"
