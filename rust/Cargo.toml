[workspace]
resolver = "2"
members = ["bml-pgserver", "bml-cli", "bml-setup", "bml-db", "bml-library"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"  # File::try_lock (download lock)
publish = false

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
bml-pgserver = { path = "bml-pgserver" }
bml-setup = { path = "bml-setup" }
bml-db = { path = "bml-db" }
bml-library = { path = "bml-library" }
# Switch to the crates.io release (0.3.1) once it is published.
bmlib = { git = "https://github.com/hherb/bmlib", rev = "02c7fad0e69ef810314915d978537dee55cbc102", default-features = false, features = ["http-ureq", "model-download", "postgres"] }
postgres = "0.19"
postgres-protocol = "0.6"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
# Ctrl-C stops `bml library update` after the paper in flight.
ctrlc = "3.4"
getrandom = "0.3"
sysinfo = { version = "0.35", default-features = false, features = ["system", "disk"] }
tempfile = "3"
# Hashing (chunk-set labels, test fixtures); the same version bmlib already pulls in.
sha2 = "0.10"
