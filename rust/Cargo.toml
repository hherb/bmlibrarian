[workspace]
resolver = "2"
members = ["bml-pgserver", "bml-cli", "bml-setup"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"  # File::try_lock (download lock)
publish = false

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
bml-pgserver = { path = "bml-pgserver" }
bml-setup = { path = "bml-setup" }
# Switch to the crates.io release (0.3.1) once it is published.
bmlib = { git = "https://github.com/hherb/bmlib", rev = "9670f4e978d0b1d4e283b97458c4d177b1abfca3", default-features = false, features = ["http-ureq", "model-download"] }
postgres = "0.19"
postgres-protocol = "0.6"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
getrandom = "0.3"
sysinfo = { version = "0.35", default-features = false, features = ["system", "disk"] }
tempfile = "3"
# Tests only (hashing a fixture); the same version bmlib already pulls in.
sha2 = "0.10"
