[package]
name = "bml-library"
description = "The BMLibrarian library pipeline: medRxiv metadata, full text and the search index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bml-db.workspace = true
# MuPDF (`pdf`) reads PDFs; llama.cpp (`embed`, Metal on macOS) embeds chunks.
bmlib = { workspace = true, features = ["pdf", "embed"] }
chrono.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[features]
# `bml_library::testing` (an in-memory `HttpClient`) for this crate's tests.
test-support = []

[dev-dependencies]
bml-library = { path = ".", features = ["test-support"] }
bml-pgserver.workspace = true
postgres.workspace = true
tempfile.workspace = true

[lints]
workspace = true
